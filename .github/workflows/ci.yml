name: CI

# pull_request covers every branch that is proposed for merge, and push covers
# main itself. Running both on every branch fired the matrix twice per commit and
# left two check runs per required name.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # The raw AIT alerts are held in Git LFS and are not fetched here, so the
      # tests that need them skip themselves. Everything else runs on synthetic
      # fixtures built inside the tests.
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ruff
        run: python -m pip install ruff

      - name: Check
        run: ruff check core meerkat bench tests

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meerkat"
version = "1.0.0"
description = "SOC alert-triage: rank a daily review queue with ATT&CK context"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "rich>=13.0",
    "matplotlib>=3.7",
    "skops>=0.11",
]

[project.scripts]
meerkat = "meerkat.cli:main"

[tool.setuptools]
packages = ["core", "meerkat"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# pycodestyle errors, pyflakes, import order, modern syntax and comprehensions.
# Rules that would force verbose idioms into hand-written code are left out.
select = ["E", "F", "I", "UP", "C4"]
ignore = ["E501"]   # long lines are hand-wrapped to match the surrounding code

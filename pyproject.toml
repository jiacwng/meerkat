[build-system]
# 77 is the first release that reads the PEP 639 license and license-files fields
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meerkat"
version = "2.0.0"
description = "Rank a SOC's open incidents and learn from the grades analysts give"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Wang Jiacheng", email = "jiacheng.wang@eurecom.fr" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=3.0",
]

[project.scripts]
meerkat = "meerkat.cli:main"

[tool.setuptools]
packages = ["core", "meerkat"]

[tool.setuptools.package-data]
core = ["data/*.json", "data/mappings/*.toml"]
meerkat = ["page.html"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# pycodestyle errors, pyflakes, import order, modern syntax and comprehensions.
select = ["E", "F", "I", "UP", "C4"]
ignore = ["E501"]   # long lines are wrapped by eye

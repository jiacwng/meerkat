<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 136" width="888" height="136" role="img" aria-labelledby="t">
  <title id="t">36,358 alerts group into 3,169 sessions, collapse into 1,771 daily families, and are cut to the 40 reviewed at a budget of 10 a day, which is a setting</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .box  { fill: #f6f8fa; stroke: #d0d7de; }
    .num  { fill: #1f2328; font-size: 25px; font-weight: 600; }
    .last { fill: #0969da; }
    .name { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .note { fill: #59636e; font-size: 11px; }
    .edge { stroke: #d0d7de; }
    .head { fill: #d0d7de; }
    .step { fill: #59636e; font-size: 10.5px; }
    @media (prefers-color-scheme: dark) {
      .box  { fill: #161b22; stroke: #30363d; }
      .num  { fill: #e6edf3; }
      .last { fill: #4493f8; }
      .name { fill: #e6edf3; }
      .note { fill: #8b949e; }
      .edge { stroke: #30363d; }
      .head { fill: #30363d; }
      .step { fill: #8b949e; }
    }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path class="head" d="M0 0 L8 4 L0 8 z"/>
    </marker>
  </defs>

  <text class="note" x="14" y="18">four days of alerts from one company. The budget of 10 a day is a setting, not a property of the tool</text>

  <rect class="box" x="14" y="30" width="176" height="86" rx="6"/>
  <text class="num"  x="34" y="66">36,358</text>
  <text class="name" x="34" y="87">alerts</text>
  <text class="note" x="34" y="104">wazuh, suricata, aminer</text>

  <rect class="box" x="242" y="30" width="176" height="86" rx="6"/>
  <text class="num"  x="262" y="66">3,169</text>
  <text class="name" x="262" y="87">sessions</text>
  <text class="note" x="262" y="104">one rule on one machine</text>

  <rect class="box" x="470" y="30" width="176" height="86" rx="6"/>
  <text class="num"  x="490" y="66">1,771</text>
  <text class="name" x="490" y="87">families</text>
  <text class="note" x="490" y="104">one rule, machine, day</text>

  <rect class="box" x="698" y="30" width="176" height="86" rx="6"/>
  <text class="num last" x="718" y="66">40</text>
  <text class="name" x="718" y="87">reviewed</text>
  <text class="note" x="718" y="104">10 a day, four days</text>

  <text class="step" x="216" y="66" text-anchor="middle">10 min</text>
  <line class="edge" x1="198" y1="76" x2="230" y2="76" marker-end="url(#a)"/>

  <text class="step" x="444" y="66" text-anchor="middle">per day</text>
  <line class="edge" x1="426" y1="76" x2="458" y2="76" marker-end="url(#a)"/>

  <text class="step" x="672" y="66" text-anchor="middle">budget</text>
  <line class="edge" x1="654" y1="76" x2="686" y2="76" marker-end="url(#a)"/>
</svg>

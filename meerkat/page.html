<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meerkat</title>
<style nonce="__NONCE__">
:root {
  color-scheme: light dark;
  --bg: #f4f4f1; --panel: #ffffff; --text: #1c1c1a; --soft: #6b6a64; --line: #dedcd3;
  --pick: #e6f1fb; --pick-text: #0c447c; --bad: #a32d2d; --cell: #f1efe8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121211; --panel: #1c1c1a; --text: #ecebe6; --soft: #9d9c94; --line: #34342f;
    --pick: #0c447c; --pick-text: #e6f1fb; --bad: #f09595; --cell: #262624;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); display: flex;
       flex-direction: column; font: 13px/1.4 system-ui, sans-serif; }
.mono, td, kbd, .stat b { font-family: ui-monospace, monospace; }
header { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; padding: 10px 14px;
         background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0 8px 0 0; align-self: center; }
.stat { display: flex; flex-direction: column; justify-content: center; padding: 4px 10px;
        background: var(--cell); border-radius: 4px; min-width: 64px; }
.stat span { font-size: 11px; color: var(--soft); }
.stat b { font-size: 15px; font-weight: 600; }
#bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 8px 14px; }
input { font: inherit; color: var(--text); background: var(--panel);
        border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; }
#search { width: 280px; }
#keys { margin-left: auto; color: var(--soft); }
#keys span { margin-left: 12px; }
kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; background: var(--panel); }
main { flex: 1; min-height: 0; display: grid; gap: 10px; padding: 0 14px 14px;
       grid-template-columns: minmax(0, 1fr) clamp(440px, 34%, 520px); }
@media (max-width: 1200px) { main { grid-template-columns: minmax(0, 1fr);
                                    grid-template-rows: minmax(0, 2fr) minmax(0, 3fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
         overflow: auto; min-height: 0; }
table { width: 100%; border-collapse: collapse; }
th { position: sticky; top: 0; background: var(--panel); text-align: left; font-weight: 500;
     color: var(--soft); font-size: 11px; padding: 6px; border-bottom: 1px solid var(--line); }
td { padding: 5px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
#detail td { white-space: normal; overflow-wrap: break-word; }
td.title { font-family: system-ui, sans-serif; max-width: 0; width: 40%;
           overflow: hidden; text-overflow: ellipsis; }
#rows tr[data-id], #similar tr, #members tr { cursor: pointer; }
#rows tr[data-id]:hover td, #similar tr:hover td, #members tr:hover td { background: var(--cell); }
#rows tr.picked td { background: var(--pick); color: var(--pick-text); }
#rows tr.below td { color: var(--soft); }
#similar tr.none { cursor: default; }
#similar tr.none td, #similar tr.other td { color: var(--soft); }
#similar tr.other td:first-child { padding-left: 22px; }
#similar tr.other td.tp { color: var(--bad); }
td.divider { font-size: 11px; color: var(--soft); background: var(--bg); }
#detail { padding: 12px 14px; }
#top { position: sticky; top: -12px; z-index: 1; background: var(--panel); margin: -12px -14px 0;
       padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
#top + dl { padding-top: 10px; }
#nav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 10px; color: var(--soft); }
#detail h2 { font-size: 15px; margin: 0 0 10px; overflow-wrap: anywhere; }
#detail h3 { font-size: 11px; font-weight: 500; color: var(--soft); text-transform: uppercase;
             letter-spacing: .04em; margin: 14px 0 6px; padding-top: 10px;
             border-top: 1px solid var(--line); }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 0; }
dt { color: var(--soft); }
dd { margin: 0; font-family: ui-monospace, monospace; overflow-wrap: anywhere;
     white-space: pre-wrap; }
.tp { color: var(--bad); font-weight: 600; }
#classification { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
#comment { width: 100%; }
button { font: inherit; color: var(--text); background: var(--panel); cursor: pointer;
         border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; }
button:hover { background: var(--cell); }
#notice { color: var(--soft); }
</style>
</head>
<body>
<header><h1>meerkat</h1></header>
<div id="bar">
  <input id="search" type="search" aria-label="filter" placeholder="filter">
  <label><input id="all" type="checkbox"> <span id="all-label">show below budget</span></label>
  <span id="notice" aria-live="polite"></span>
  <span id="keys"></span>
</div>
<main>
  <div class="panel"><table>
    <thead><tr id="head"></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <section id="detail" class="panel"></section>
</main>
<script nonce="__NONCE__">
"use strict";
const TOKEN = "__TOKEN__";
const COLUMNS = [
  ["#", row => String(row.position)], ["incident", row => row.IncidentId],
  ["score", row => row.score.toFixed(2)],
  ["group", row => row.members.length ? String(row.members.length + 1) : ""],
  ["rule_tp", row => `${row.rule_true_positives}/${row.rule_classified}`],
  ["similar_tp", row => `${row.similar_true_positive}/${row.similar}`],
  ["flag", row => row.flag], ["category", row => row.Category],
  ["severity", row => row.Severity],
  ["host", row => row.host], ["user", row => row.user],
  ["time", row => clock(row.latest)], ["title", row => row.AlertTitle],
];
const state = { columns: COLUMNS, record: null, shown: [], picked: null, viewing: null, open: false, keys: {} };

function el(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function classifiedBefore(...counts) {
  const cells = counts.map(([tp, bp, total]) => [tp, bp, total - tp - bp, total].map(String));
  const wide = [0, 1, 2, 3].map(at => Math.max(...cells.map(cell => cell[at].length)));
  return cells.map(cell => {
    const [tp, bp, fp, total] = cell.map((text, at) => text.padStart(wide[at]));
    return `${tp} TP  ${bp} BP  ${fp} FP  of ${total} classified before`;
  });
}

function stat(label, value) {
  const box = el("div", undefined, "stat");
  box.append(el("span", label), el("b", String(value)));
  return box;
}

function fields(pairs) {
  const list = el("dl");
  for (const [name, value] of pairs) {
    if (value) list.append(el("dt", name), el("dd", value));
  }
  return list;
}

function clock(timestamp) {
  return `${timestamp.slice(5, 10)} ${timestamp.slice(11, 16)}`;
}

async function call(path, body) {
  const options = { headers: { "X-Meerkat-Token": TOKEN } };
  if (body) Object.assign(options, { method: "POST", body: JSON.stringify(body) });
  const answer = await fetch(path, options);
  const value = await answer.json();
  if (!answer.ok) throw new Error(value.error);
  return value;
}

async function load(keep) {
  const record = await call("/api/queue");
  state.record = record;
  state.columns = COLUMNS.filter(([name]) => name !== "severity" || record.queue.some(row => row.Severity));
  document.getElementById("head").replaceChildren(...state.columns.map(([name]) => el("th", name)));
  state.keys = Object.fromEntries(record.classifications.map(name => [name[0].toLowerCase(), name]));
  for (const row of record.queue) {
    row.text = [row.IncidentId, row.AlertTitle, row.DetectorId, row.Category, row.Severity,
                row.MitreTechniques, ...row.members,
                ...record.links.map(name => row[name])].join(" ").toLowerCase();
  }
  const header = document.querySelector("header");
  const stats = [stat("open", record.open), stat("budget", record.budget ?? "none")];
  if (record.budget !== null) {
    stats.push(stat("to read", record.to_read), stat("below budget", record.below_budget));
  }
  header.replaceChildren(el("h1", "meerkat"), ...stats);
  document.getElementById("all-label").textContent = `show below budget ${record.below_budget}`;
  const keys = document.getElementById("keys");
  keys.replaceChildren();
  const hints = [["j", "next"], ["k", "previous"],
                 ...Object.entries(state.keys).map(([key, name]) => [key, name.replace(/[a-z]/g, "")]),
                 ["/", "filter"]];
  for (const [key, label] of hints) keys.append(el("span", undefined), el("kbd", key), ` ${label}`);
  draw(keep);
}

function draw(keep) {
  const words = document.getElementById("search").value.toLowerCase().split(/\s+/).filter(Boolean);
  const matching = state.record.queue.filter(row => words.every(word => row.text.includes(word)));
  const all = document.getElementById("all").checked;
  state.shown = matching.filter(row => all || row.placement !== "below budget");

  const body = document.getElementById("rows");
  body.replaceChildren();
  const divider = text => {
    const line = el("tr"), cell = el("td", text, "divider");
    cell.colSpan = state.columns.length;
    line.append(cell);
    body.append(line);
  };
  if (!state.shown.length) divider(`0 match, ${matching.length} below budget`);
  let divided = false;
  for (const row of state.shown) {
    const under = row.placement === "below budget";
    if (under && !divided) {
      divider(`below budget ${state.record.below_budget}`);
      divided = true;
    }
    const line = el("tr", undefined, under ? "below" : "");
    line.dataset.id = row.IncidentId;
    for (const [name, cell] of state.columns) {
      const td = el("td", cell(row), name === "title" ? "title" : "");
      if (name === "title") td.title = row.AlertTitle;
      line.append(td);
    }
    line.addEventListener("click", () => select(row.IncidentId));
    body.append(line);
  }
  const kept = state.shown.some(row => row.IncidentId === keep);
  select(kept ? keep : state.shown.length ? state.shown[0].IncidentId : null);
}

function select(id) {
  state.picked = id;
  for (const line of document.querySelectorAll("#rows tr[data-id]")) {
    line.classList.toggle("picked", line.dataset.id === id);
    if (line.dataset.id === id) line.scrollIntoView({ block: "nearest" });
  }
  if (state.viewing !== id || id === null) show(id);
}

function classificationCell(classification) {
  return el("td", classification, classification === state.record.classifications[0] ? "tp" : "");
}

async function show(id) {
  state.viewing = id;
  state.open = false;
  const pane = document.getElementById("detail");
  if (id === null) { pane.replaceChildren(); return; }
  let row;
  try { row = await call(`/api/incident?id=${encodeURIComponent(id)}`); }
  catch (error) { pane.replaceChildren(el("p", error.message)); return; }
  if (state.viewing !== id) return;
  state.open = row.IncidentGrade === "";

  const nav = el("div");
  nav.id = "nav";
  const at = state.shown.findIndex(shown => shown.IncidentId === state.picked);
  const up = el("button", "▲"), down = el("button", "▼");
  up.addEventListener("click", () => step(-1));
  down.addEventListener("click", () => step(1));
  nav.append(up, down, el("span", `${at + 1} / ${state.shown.length}`, "mono"));
  if (id !== state.picked && state.picked !== null) {
    const back = el("button", `◀ ${state.picked}`);
    back.addEventListener("click", () => show(state.picked));
    nav.append(back);
  }

  const comment = el("input");
  comment.id = "comment";
  comment.type = "text";
  comment.setAttribute("aria-label", "comment");
  comment.placeholder = "comment";
  const buttons = el("div");
  buttons.id = "classification";
  for (const [key, classification] of Object.entries(state.keys)) {
    const button = el("button", state.open ? `${classification} ${key}` : classification);
    button.addEventListener("click", () => classify(classification));
    buttons.append(button);
  }
  if (state.open && row.members.length) {
    const whole = el("input"), label = el("label");
    whole.id = "whole";
    whole.type = "checkbox";
    label.append(whole, ` group ${row.members.length + 1}`);
    buttons.append(label);
  }
  const top = el("div");
  top.id = "top";
  top.append(nav, el("h2", row.AlertTitle || row.IncidentId), buttons, comment);

  const [rule, similar] = classifiedBefore(
    [row.rule_true_positives, row.rule_benign_positives, row.rule_classified],
    [row.similar_true_positive, row.similar_benign_positive, row.similar]);
  const parts = [top, fields([
    ["incident", row.IncidentId], ["time", row.Timestamp], ["rule", row.DetectorId],
    ["category", row.Category], ["severity", row.Severity],
    ["techniques", row.MitreTechniques.join(", ")],
    ["classification", row.IncidentGrade || "open"], ["placement", row.placement],
  ]), el("h3", "score"), fields([
    ["score", row.score.toFixed(2)], ["rule", rule], ["similar", similar],
    ["same rule", row.similar ? `${row.similar_same_rule} of ${row.similar}` : ""],
  ])];

  if (row.entities.length) {
    const short = state.record.classifications.map(name => name.replace(/[a-z]/g, ""));
    const table = el("table"), head = el("tr"), body = el("tbody");
    for (const name of ["entity", "value", "classified_before", ...short]) head.append(el("th", name));
    body.id = "similar";
    for (const entity of row.entities) {
      const line = el("tr");
      line.append(el("td", entity.field), el("td", entity.value),
                  el("td", String(entity.classified_before)),
                  ...state.record.classifications.map((name, at) =>
                    el("td", String(entity[name]), at === 0 && entity[name] ? "tp" : "")));
      body.append(line);
      if (!entity.classified_before) { line.className = "none"; continue; }
      const key = `${entity.field} ${entity.value}`;
      const others = row.similar_incidents.filter(other => other.shared.includes(key)).map(other => {
        const inner = el("tr", undefined, "other");
        inner.hidden = true;
        inner.title = other.AlertTitle;
        inner.append(el("td", other.IncidentId), el("td", other.Timestamp),
                     el("td", `rule ${other.DetectorId}`), classificationCell(other.IncidentGrade));
        inner.lastChild.colSpan = state.record.classifications.length;
        inner.addEventListener("click", () => show(other.IncidentId));
        return inner;
      });
      line.addEventListener("click", () => { for (const inner of others) inner.hidden = !inner.hidden; });
      body.append(...others);
    }
    table.append(head, body);
    parts.push(el("h3", "entities"), table);
  }

  if (row.members.length) {
    const table = el("table"), body = el("tbody");
    body.id = "members";
    for (const member of row.members) {
      const line = el("tr");
      line.append(el("td", member));
      line.addEventListener("click", () => show(member));
      body.append(line);
    }
    table.append(body);
    parts.push(el("h3", `group ${row.members.length + 1}`), table);
  }

  if (row.classification_history.length) {
    const table = el("table"), head = el("tr"), body = el("tbody");
    for (const name of ["classified", "classification", "comment"]) head.append(el("th", name));
    for (const past of row.classification_history) {
      const line = el("tr");
      line.append(el("td", past.time), classificationCell(past.classification), el("td", past.comment));
      body.append(line);
    }
    table.append(head, body);
    parts.push(el("h3", "history"), table);
  }

  pane.replaceChildren(...parts);
  pane.scrollTop = 0;
}

async function classify(classification) {
  const id = state.viewing;
  if (id === null) return;
  const at = state.shown.findIndex(row => row.IncidentId === state.picked);
  const next = id === state.picked ? state.shown[at + 1] || state.shown[at - 1] : state.shown[at];
  const notice = document.getElementById("notice");
  try {
    const whole = document.getElementById("whole");
    await call("/api/classify", { incident: id, classification,
                                  group: whole !== null && whole.checked,
                                  comment: document.getElementById("comment").value });
  } catch (error) { notice.replaceChildren(error.message); return; }
  const open = el("button", `${id} ${classification}`);
  open.addEventListener("click", () => show(id));
  notice.replaceChildren(open);
  state.viewing = null;
  try { await load(next ? next.IncidentId : null); }
  catch (error) { notice.append(" ", error.message); }
}

function step(by) {
  if (!state.shown.length) return;
  const at = state.shown.findIndex(row => row.IncidentId === state.picked);
  const to = Math.min(state.shown.length - 1, Math.max(0, at + by));
  select(state.shown[to].IncidentId);
}

document.addEventListener("keydown", event => {
  if (event.target.tagName === "INPUT" && event.target.type !== "checkbox") {
    if (event.key !== "Escape") return;
    if (event.target.id === "search") { event.target.value = ""; draw(state.picked); }
    event.target.blur();
    return;
  }
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  if (event.key === "j" || event.key === "ArrowDown") { step(1); event.preventDefault(); }
  else if (event.key === "k" || event.key === "ArrowUp") { step(-1); event.preventDefault(); }
  else if (event.key === "/") { document.getElementById("search").focus(); event.preventDefault(); }
  else if (state.open && state.viewing === state.picked && state.keys[event.key]) {
    classify(state.keys[event.key]);
  }
});
document.getElementById("search").addEventListener("input", () => draw(state.picked));
document.getElementById("all").addEventListener("change", () => draw(state.picked));
load(null).catch(error => { document.getElementById("notice").textContent = error.message; });
</script>
</body>
</html>

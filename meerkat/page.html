<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meerkat</title>
<style nonce="__NONCE__">
:root {
  --bg: #fafaf8; --panel: #ffffff; --text: #1c1c1a; --soft: #5f5e5a; --line: #dedcd3;
  --pick: #e6f1fb; --pick-text: #0c447c; --bad: #a32d2d; --tag: #f1efe8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --soft: #a3a299; --line: #3a3a36;
    --pick: #0c447c; --pick-text: #e6f1fb; --bad: #f09595; --tag: #2c2c2a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 14px/1.45 system-ui, sans-serif; }
header { padding: 14px 20px 10px; border-bottom: 1px solid var(--line); }
h1 { font-size: 16px; font-weight: 600; margin: 0 12px 0 0; display: inline; }
#counts, #sample, #notice { color: var(--soft); }
#sample, #notice { margin: 2px 0 0; min-height: 20px; }
#bar { display: flex; gap: 14px; align-items: center; padding: 10px 20px; flex-wrap: wrap; }
input[type=search], input[type=text] {
  padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel); color: var(--text); font: inherit; }
#search { flex: 1; min-width: 220px; }
#keys { color: var(--soft); font-size: 12px; }
kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px;
      font: 12px ui-monospace, monospace; background: var(--panel); }
main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(340px, 2fr); gap: 16px;
       padding: 0 20px 20px; align-items: start; }
@media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
table { width: 100%; border-collapse: collapse; background: var(--panel);
        border: 1px solid var(--line); }
th { text-align: left; font-weight: 500; color: var(--soft); font-size: 12px;
     padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
#rows tr, #linked tr { cursor: pointer; }
#rows tr:hover td, #linked tr:hover td { background: var(--tag); }
#rows tr.picked td { background: var(--pick); color: var(--pick-text); }
#rows tr.below td { color: var(--soft); }
td.divider, td.empty { font-size: 12px; color: var(--soft); background: var(--bg);
                       cursor: default; }
.num { font: 13px ui-monospace, monospace; white-space: nowrap; }
.tag { font-size: 11px; background: var(--tag); color: var(--soft); border-radius: 4px;
       padding: 1px 6px; margin-left: 6px; white-space: nowrap; cursor: help; }
main > * { min-width: 0; }
#detail { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
          padding: 16px; position: sticky; top: 12px; max-height: calc(100vh - 24px);
          overflow-y: auto; }
#linked .num { white-space: normal; }
#detail h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
#detail .meta { color: var(--soft); font-size: 12px; margin: 0 0 12px; overflow-wrap: anywhere; }
#detail .closed { background: var(--tag); border-radius: 6px; padding: 8px 10px; margin: 0 0 12px; }
.scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 12px; }
.scores div { background: var(--tag); border-radius: 6px; padding: 8px 10px; }
.scores span { display: block; font-size: 11px; color: var(--soft); }
.scores b { font-size: 18px; font-weight: 600; }
#detail h3 { font-size: 12px; font-weight: 500; color: var(--soft); margin: 14px 0 4px; }
#detail p { margin: 0 0 4px; overflow-wrap: anywhere; }
#detail table { font-size: 13px; }
.tp { color: var(--bad); font-weight: 500; }
.soft { color: var(--soft); font-size: 12px; }
#grade { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
#comment { width: 100%; }
button { font: inherit; padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px;
         background: var(--panel); color: var(--text); cursor: pointer; }
button:hover { background: var(--tag); }
button.link { border: 0; padding: 0 0 0 6px; background: none; text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1>meerkat</h1><span id="counts"></span>
  <p id="sample" title="A few incidents below the budget are drawn at random and shown in the list. Their grades give this estimate of the true positives that go unread."></p>
  <p id="notice" aria-live="polite"></p>
</header>
<div id="bar">
  <input id="search" type="search" aria-label="Filter the queue"
         placeholder="Filter by title, host, user, rule, category, technique or incident">
  <label title="The budget is how many incidents the team plans to read. The rest are listed here."><input id="all" type="checkbox"> <span id="all-label">Show below the budget</span></label>
  <span id="keys"><kbd>j</kbd> <kbd>k</kbd> move &nbsp; <kbd>t</kbd> <kbd>b</kbd> <kbd>f</kbd>
    grade &nbsp; <kbd>/</kbd> filter</span>
</div>
<main>
  <table>
    <thead><tr>
      <th title="How likely the incident is a true positive, from 0 to 1">Score</th>
      <th>Title</th><th>Host</th><th>User</th>
      <th title="True positives over graded incidents of this rule at this site">Rule TP</th>
      <th title="True positives over earlier incidents sharing a device, account, address, file or URL">Linked TP</th>
      <th>Time (UTC)</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <section id="detail"></section>
</main>
<script nonce="__NONCE__">
"use strict";
const TOKEN = "__TOKEN__";
const GRADES = [["t", "TruePositive", "True positive"], ["b", "BenignPositive", "Benign positive"],
                ["f", "FalsePositive", "False positive"]];
const LABEL = Object.fromEntries(GRADES.map(([, grade, label]) => [grade, label]));
const ENTITIES = ["DeviceName", "DeviceId", "AccountUpn", "AccountName", "AccountSid",
                  "AccountObjectId", "IpAddress", "Sha256", "Url"];
const LINKED_ROWS = 20;
const TAGS = {
  "sample": "Drawn at random from below the budget, to estimate what goes unread.",
  "linked": "Below the budget, but an earlier incident sharing an entity was a true positive.",
  "new rule": "Below the budget, and no incident of this rule has been graded yet.",
};
const CELLS = [
  row => row.score.toFixed(2), row => row.AlertTitle, row => row.host, row => row.user,
  row => `${row.rule_true_positives}/${row.rule_graded}`,
  row => `${row.linked_true_positive}/${row.linked}`, row => clock(row.Timestamp),
];
const state = { queue: [], shown: [], picked: null, viewing: null, open: false };

function el(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function fullRow(text, className) {
  const line = el("tr"), cell = el("td", text, className);
  cell.colSpan = CELLS.length;
  line.append(cell);
  return line;
}

function clock(timestamp) {
  return timestamp.replace("T", " ").replace("Z", "");
}

function firstValue(...lists) {
  for (const list of lists) {
    const values = list.split("|").filter(Boolean);
    if (values.length) return values[0] + (values.length > 1 ? ` +${values.length - 1}` : "");
  }
  return "";
}

function tagOf(row) {
  if (row.status === "sample") return "sample";
  if (row.status !== "below") return "";
  if (row.linked_true_positive >= 1) return "linked";
  return row.rule_graded === 0 ? "new rule" : "";
}

function notice(text, incident) {
  const line = document.getElementById("notice");
  line.replaceChildren(text);
  if (incident) {
    const open = el("button", "Open it", "link");
    open.addEventListener("click", () => show(incident));
    line.append(open);
  }
}

async function call(path, body) {
  const options = { headers: { "X-Meerkat-Token": TOKEN } };
  if (body) Object.assign(options, { method: "POST", body: JSON.stringify(body) });
  const answer = await fetch(path, options);
  const value = await answer.json();
  if (!answer.ok) throw new Error(value.error);
  return value;
}

async function load(keep) {
  const record = await call("/api/queue");
  state.queue = record.queue.map(row => ({
    ...row, host: firstValue(row.DeviceName, row.DeviceId),
    user: firstValue(row.AccountUpn, row.AccountName, row.AccountSid),
    text: [row.IncidentId, row.AlertTitle, row.DetectorId, row.Category, row.MitreTechniques,
           ...ENTITIES.map(name => row[name])].join(" ").toLowerCase(),
  }));
  const counted = record.budget !== null;
  document.getElementById("counts").textContent = counted
    ? `${record.open} open, ${record.to_read} to read, ${record.below_budget} below the budget, budget ${record.budget}`
    : `${record.open} open, no budget set`;
  const sample = record.sample, unread = record.unread_true_positives;
  document.getElementById("sample").textContent = !counted ? ""
    : unread === null
      ? `Sample: ${sample.drawn} drawn, 0 graded, ${sample.not_sampled} not sampled`
      : `Sample: ${sample.graded} graded, ${sample.true_positive} true positive, ` +
        `${sample.not_sampled} not sampled. Unread true positives: ${unread.low} to ${unread.high} (95%)`;
  document.getElementById("all-label").textContent = `Show ${record.below_budget} below the budget`;
  draw(keep);
}

function draw(keep) {
  const words = document.getElementById("search").value.toLowerCase().split(/\s+/).filter(Boolean);
  const matching = state.queue.filter(row => words.every(word => row.text.includes(word)));
  const all = document.getElementById("all").checked;
  state.shown = matching.filter(row => all || row.status !== "below");

  const body = document.getElementById("rows");
  body.replaceChildren();
  if (!state.shown.length) {
    const hidden = matching.length ? ` ${matching.length} match below the budget.` : "";
    body.append(fullRow(state.queue.length ? `Nothing to read matches the filter.${hidden}`
                                           : "No open incidents.", "empty"));
  }
  let divided = false;
  for (const row of state.shown) {
    if (row.status === "below" && !divided) {
      body.append(fullRow("Below the budget", "divider"));
      divided = true;
    }
    const line = el("tr", undefined, row.status === "below" ? "below" : "");
    line.dataset.id = row.IncidentId;
    CELLS.forEach((text, at) => line.append(el("td", text(row), at === 1 ? "" : "num")));
    const tag = tagOf(row);
    if (tag) {
      const mark = el("span", tag, "tag");
      mark.title = TAGS[tag];
      line.children[1].append(mark);
    }
    line.addEventListener("click", () => select(row.IncidentId));
    body.append(line);
  }
  const kept = state.shown.some(row => row.IncidentId === keep);
  select(kept ? keep : state.shown.length ? state.shown[0].IncidentId : null);
}

function select(id) {
  state.picked = id;
  for (const line of document.querySelectorAll("#rows tr")) {
    line.classList.toggle("picked", line.dataset.id === id);
    if (line.dataset.id === id) line.scrollIntoView({ block: "nearest" });
  }
  if (state.viewing !== id || id === null) show(id);
}

async function show(id) {
  state.viewing = id;
  state.open = false;
  const pane = document.getElementById("detail");
  if (id === null) { pane.replaceChildren(el("p", "Select an incident.", "soft")); return; }
  let row;
  try { row = await call(`/api/incident?id=${encodeURIComponent(id)}`); }
  catch (error) { pane.replaceChildren(el("p", error.message, "soft")); return; }
  if (state.viewing !== id) return;
  state.open = row.IncidentGrade === "";

  const parts = [];
  if (id !== state.picked && state.picked !== null) {
    const back = el("button", `Back to incident ${state.picked}`);
    back.addEventListener("click", () => show(state.picked));
    parts.push(back);
  }
  const meta = [`incident ${row.IncidentId}`, `rule ${row.DetectorId}`, row.Category,
                row.MitreTechniques.join(", "), `${clock(row.Timestamp)} UTC`].filter(Boolean);
  parts.push(el("h2", row.AlertTitle || `Incident ${row.IncidentId}`),
             el("p", meta.join(" · "), "meta"));
  if (!state.open) {
    parts.push(el("p", `Graded ${LABEL[row.IncidentGrade]}. It is no longer in the queue.`, "closed"));
  }

  const scores = el("div", undefined, "scores");
  for (const [label, key] of [["Score", "score"], ["Without the linked incidents", "score_without_links"],
                              ["If this rule had no history", "score_as_new_rule"]]) {
    const box = el("div");
    box.append(el("span", label), el("b", row[key].toFixed(2)));
    scores.append(box);
  }
  parts.push(scores,
    el("h3", "Rule history at this site"),
    el("p", row.rule_graded ? `${row.rule_true_positives} true positive of ${row.rule_graded} graded`
                            : "No incident of this rule has been graded yet."),
    el("h3", "Earlier incidents sharing a device, account, address, file or URL"),
    el("p", row.linked ? `${row.linked}: ${row.linked_true_positive} true positive, ` +
      `${row.linked_benign_positive} benign positive, ${row.linked_false_positive} false positive`
      : "None."));

  if (row.linked_incidents.length) {
    const table = el("table"), body = el("tbody");
    body.id = "linked";
    for (const linked of row.linked_incidents.slice(0, LINKED_ROWS)) {
      const line = el("tr");
      const what = el("td", linked.AlertTitle);
      if (linked.shared.length) what.append(el("br"), el("span", `shares ${linked.shared.join(", ")}`, "soft"));
      line.append(el("td", linked.IncidentId, "num"),
                  el("td", LABEL[linked.IncidentGrade], linked.IncidentGrade === "TruePositive" ? "tp" : ""),
                  el("td", clock(linked.Timestamp), "num"), what);
      line.addEventListener("click", () => show(linked.IncidentId));
      body.append(line);
    }
    table.append(body);
    parts.push(table);
    const older = row.linked_incidents.length - LINKED_ROWS;
    if (older > 0) parts.push(el("p", `The ${LINKED_ROWS} most recent are listed. ${older} older are not.`, "soft"));
  }
  const entities = ENTITIES.filter(name => row[name].length).map(name => `${name}: ${row[name].join(", ")}`);
  if (entities.length) parts.push(el("h3", "Entities"), ...entities.map(text => el("p", text)));

  parts.push(el("h3", state.open ? "Grade" : "Change the grade"));
  if (state.open) {
    const comment = el("input");
    comment.id = "comment";
    comment.type = "text";
    comment.placeholder = "Comment, stored with the grade (optional)";
    parts.push(comment);
  }
  const buttons = el("div");
  buttons.id = "grade";
  for (const [key, grade, label] of GRADES) {
    const button = el("button", state.open ? `${label} (${key})` : label);
    button.addEventListener("click", () => gradeIt(grade));
    buttons.append(button);
  }
  parts.push(buttons);
  pane.replaceChildren(...parts);
  pane.scrollTop = 0;
}

async function gradeIt(grade) {
  const id = state.viewing;
  if (id === null) return;
  const at = state.shown.findIndex(row => row.IncidentId === state.picked);
  const next = id === state.picked ? state.shown[at + 1] || state.shown[at - 1] : state.shown[at];
  const comment = document.getElementById("comment");
  try {
    await call("/api/grade", { incident: id, grade, note: comment ? comment.value : "" });
  } catch (error) { notice(error.message); return; }
  notice(`${id} graded ${LABEL[grade]}.`, id);
  state.viewing = null;
  try { await load(next ? next.IncidentId : null); }
  catch (error) { notice(`${id} graded ${LABEL[grade]}, but the queue did not reload: ${error.message}`); }
}

function step(by) {
  if (!state.shown.length) return;
  const at = state.shown.findIndex(row => row.IncidentId === state.picked);
  const to = Math.min(state.shown.length - 1, Math.max(0, at + by));
  select(state.shown[to].IncidentId);
}

document.addEventListener("keydown", event => {
  if (event.target.tagName === "INPUT" && event.target.type !== "checkbox") {
    if (event.key !== "Escape") return;
    if (event.target.id === "search") { event.target.value = ""; draw(state.picked); }
    event.target.blur();
    return;
  }
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  if (event.key === "j" || event.key === "ArrowDown") { step(1); event.preventDefault(); }
  else if (event.key === "k" || event.key === "ArrowUp") { step(-1); event.preventDefault(); }
  else if (event.key === "/") { document.getElementById("search").focus(); event.preventDefault(); }
  else if (state.open && state.viewing === state.picked) {
    const found = GRADES.find(([key]) => key === event.key);
    if (found) gradeIt(found[1]);
  }
});
document.getElementById("search").addEventListener("input", () => draw(state.picked));
document.getElementById("all").addEventListener("change", () => draw(state.picked));
load(null).catch(error => notice(error.message));
</script>
</body>
</html>
